name: PR-pipeline_ops-transformer

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: "ops-transformer"
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "Compile_Ascend_X86: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: compile
    jobs:
      JOB_check_examples_ut:
        name: Check_examples_ut
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: check_examples_ut
            run: |
              set -e
              cd ${{ steps.process_checkout.outputs.path }}
              python3 scripts/ci/check_examples_ut.py pr_filelist.txt
          -
            name: upload_check_report
            if: ${{ always() }}
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/build/check_examples_ut.csv
              object-prefix: ${{ env.obs_path }}/
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
      JOB_x86_compile:
        name: Compile_x86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_linux-x86_64.run'
      JOB_arm_compile:
        name: Compile_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_linux-aarch64.run'
      JOB_experimental_compile:
        name: Compile_experimental_x86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_experimental'
          ge_st_rt2: 'experimental'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_experimental }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_experimental_linux-x86_64.run'
      JOB_arm_experimental_compile:
        name: Compile_experimental_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_experimental'
          ge_st_rt2: 'experimental'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_experimental }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_experimental_linux-aarch64.run'
      JOB_x86_compile_ubuntu24:
        name: Compile_x86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_linux-x86_64_ubuntu24.run'
      JOB_arm_compile_ubuntu24:
        name: Compile_arm_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_linux-aarch64_ubuntu24.run'
      JOB_experimental_compile_ubuntu24:
        name: Compile_experimental_x86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_experimental_ubuntu24'
          ge_st_rt2: 'experimental'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_experimental_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_experimental_linux-x86_64_ubuntu24.run'
      JOB_arm_experimental_compile_ubuntu24:
        name: Compile_experimental_arm_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_experimental_ubuntu24'
          ge_st_rt2: 'experimental'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_experimental_ubuntu24 }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_experimental_linux-aarch64_ubuntu24.run'
      JOB_monitor_910b_compile:
        name: Compile_monitor_910b
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'monitor'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-monitor-910b_linux-x86_64.run'
      JOB_monitor_910c_compile:
        name: Compile_monitor_910c
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'monitor_910c'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-monitor-910c_linux-x86_64.run'
      JOB_monitor_950_compile:
        name: Compile_monitor_950
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'monitor_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor_9_0_0 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-monitor-950_linux-x86_64.run'
      JOB_experimental_950_compile:
        name: Compile_experimental_950_x86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_experimental'
          ge_st_rt2: 'experimental_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_experimental }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_experimental_950_linux-x86_64.run'
      JOB_arm_experimental_950_compile:
        name: Compile_experimental_950_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_experimental'
          ge_st_rt2: 'experimental_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_experimental }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_experimental_950_linux-aarch64.run'
      JOB_experimental_950_compile_ubuntu24:
        name: Compile_experimental_950_x86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_experimental_ubuntu24'
          ge_st_rt2: 'experimental_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_experimental_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer_experimental_950_linux-x86_64_ubuntu24.run'
      JOB_arm_experimental_950_compile_ubuntu24:
        name: Compile_experimental_950_arm_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_experimental_ubuntu24'
          ge_st_rt2: 'experimental_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_experimental_ubuntu24 }}
          arch: 'arm64'
          package_name: 'cann-ops-transformer_experimental_950_linux-aarch64_ubuntu24.run'
      JOB_mobile_station_compile:
        name: Compile_kirinx90
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_mobile_station'
          ge_st_rt2: 'kirinx90'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-kirinx90_linux-x86_64.run'
      JOB_mobile_station_compile_ubuntu24:
        name: Compile_kirinx90_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_mobile_station_ubuntu24'
          ge_st_rt2: 'kirinx90'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-kirinx90_linux-x86_64_ubuntu24.run'
      JOB_mobile_station_compile_9030_ubuntu24:
        name: Compile_kirin9030_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'Compile_Ascend_X86_mobile_station_9030_ubuntu24'
          ge_st_rt2: 'kirin9030'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-ops-transformer-kirin9030_linux-x86_64_ubuntu24.run'
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_Pre_Compile:
        name: Compile_pre
        uses: .gitcode/workflows/compile_action.yml
        if: env.TARGET_BRANCH != 'master'
        with:
          task_name: 'Pre_Compile'
          image_version: ${{ jobs.JOB_image.outputs.Pre_Compile }}
          arch: 'arm64'
          spec: '2xlarge'
      # ============ distest: HOST 只编 host, 产物 custom_host_<soc>.run(不含 kernel bin) ============
      Pre_compile_host_910B:
        name: Pre_compile_host_910B
        uses: .gitcode/workflows/compile_action.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'Pre_Compile_host_910B'
          image_version: ${{ jobs.JOB_image.outputs.Pre_Compile }}
          arch: 'arm64'
          spec: 'xlarge'
          package_name: 'custom_host_ascend910b.run'
      Pre_compile_host_950:
        name: Pre_compile_host_950
        uses: .gitcode/workflows/compile_action.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'Pre_Compile_host_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          spec: 'xlarge'
          package_name: 'custom_host_ascend950.run'
      # ============ distest: kernel 只编 kernel, 产物 kernel_<soc>.tar.gz(*.o/*.json) ============
      Pre_compile_kernel_910B:
        name: Pre_compile_kernel_910B
        uses: .gitcode/workflows/compile_action_dis.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'Pre_Compile_kernel_910B'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          spec: '2xlarge'
          package_name: 'kernel_ascend910b.tar.gz'
      Pre_compile_kernel_950:
        name: Pre_compile_kernel_950
        uses: .gitcode/workflows/compile_action_dis.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'Pre_Compile_kernel_950'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          spec: '2xlarge'
          package_name: 'kernel_ascend950.tar.gz'
      # ============ repackage 下载 host/kernel 产物, 调用 repack 脚本合并成最终 custom 包 ============
      Pre_compile_package_910B:
        name: Pre_compile_package_910B
        if: env.TARGET_BRANCH == 'master'
        needs:
          - Pre_compile_host_910B
          - Pre_compile_kernel_910B
        runs-on: ["self-hosted", "arch=arm64", "spec=xlarge"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Pre_Compile }}
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          - name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/custom_host_ascend910b.run
                ${{ env.obs_path }}/dis/kernel_ascend910b.tar.gz
              path: ${{ steps.process_checkout.outputs.path }}/build_out_distest
          - name: repackage
            run: |
              set -e
              export WORKSPACE=${{ steps.process_checkout.outputs.path }}
              cd "${WORKSPACE}"
              if [ -f /home/jenkins/Ascend/cann/bin/setenv.bash ]; then
                  source /home/jenkins/Ascend/cann/bin/setenv.bash
              fi
              # 空跑兼容: host/kernel 产物为空占位文件(0字节)时跳过 repack, touch 空的最终包
              if [ ! -s build_out_distest/custom_host_ascend910b.run ] || [ ! -s build_out_distest/kernel_ascend910b.tar.gz ]; then
                  echo "skip repackage: empty host/kernel artifacts (no compile scope)"
                  touch build_out_distest/cann-ops-transformer-custom_linux-aarch64.run
                  exit 0
              fi
              mkdir -p kernel_pkg
              tar -xzf build_out_distest/kernel_ascend910b.tar.gz -C kernel_pkg
              chmod +x build_out_distest/custom_host_ascend910b.run
              bash scripts/ci/repack_custom_operator.sh \
                  --host-pkg "${WORKSPACE}/build_out_distest/custom_host_ascend910b.run" \
                  --kernel-dir "${WORKSPACE}/kernel_pkg/ascend910b" \
                  --soc ascend910b \
                  --vendor-name custom \
                  --output "${WORKSPACE}/build_out_distest/cann-ops-transformer-custom_linux-aarch64.run"
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: ${{ steps.process_checkout.outputs.path }}/build_out_distest/cann-ops-transformer-custom_linux-aarch64.run
              object-prefix: ${{ env.obs_path }}/
      Pre_compile_package_950:
        name: Pre_compile_package_950
        if: env.TARGET_BRANCH == 'master'
        needs:
          - Pre_compile_host_950
          - Pre_compile_kernel_950
        runs-on: ["self-hosted", "arch=x64", "spec=xlarge"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          - name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/custom_host_ascend950.run
                ${{ env.obs_path }}/dis/kernel_ascend950.tar.gz
              path: ${{ steps.process_checkout.outputs.path }}/build_out_distest
          - name: repackage
            run: |
              set -e
              export WORKSPACE=${{ steps.process_checkout.outputs.path }}
              cd "${WORKSPACE}"
              if [ -f /home/jenkins/Ascend/cann/bin/setenv.bash ]; then
                  source /home/jenkins/Ascend/cann/bin/setenv.bash
              fi
              # 空跑兼容: host/kernel 产物为空占位文件(0字节)时跳过 repack, touch 空的最终包
              if [ ! -s build_out_distest/custom_host_ascend950.run ] || [ ! -s build_out_distest/kernel_ascend950.tar.gz ]; then
                  echo "skip repackage: empty host/kernel artifacts (no compile scope)"
                  touch build_out_distest/cann-ops-transformer-ascend950-custom_linux-x86_64.run
                  exit 0
              fi
              mkdir -p kernel_pkg
              tar -xzf build_out_distest/kernel_ascend950.tar.gz -C kernel_pkg
              chmod +x build_out_distest/custom_host_ascend950.run
              bash scripts/ci/repack_custom_operator.sh \
                  --host-pkg "${WORKSPACE}/build_out_distest/custom_host_ascend950.run" \
                  --kernel-dir "${WORKSPACE}/kernel_pkg/ascend950" \
                  --soc ascend950 \
                  --vendor-name custom \
                  --output "${WORKSPACE}/build_out_distest/cann-ops-transformer-ascend950-custom_linux-x86_64.run"
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: ${{ steps.process_checkout.outputs.path }}/build_out_distest/cann-ops-transformer-ascend950-custom_linux-x86_64.run
              object-prefix: ${{ env.obs_path }}/
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: ut
    jobs:
      JOB_api_check:
        name: API_Check
        steps:
          -
            name: api-check
            identifier: api-check
            uses: cann/.gitcode/actions/api-check@master
            with:
              org_name: ${{ env.org_name }}
              mode: check
              repo_name: ${{ env.repo_name }}
              merge_id: ${{ env.MERGE_ID }}
        if: env.TARGET_BRANCH == 'master'
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.codecheck }}
      JOB_ut:
        name: UT_ops-transformer
        uses: .gitcode/workflows/ut_action.yml
        with:
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      A2_smoke:
        name: PreSmoke_A2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
              set -e
              export repo_name=${{env.repo_name}}
              export pr_id=${{ env.MERGE_ID }}
              export AK=${{secrets.AK}}
              export SK=${{secrets.SK}}
              export obs_smoke_path=${{ env.obs_smoke_path }}
              export obs_path=${{ env.obs_path }}
              export WORKSPACE=${{ steps.process_checkout.outputs.path }}
              bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${{ env.obs_smoke_path }}/plog/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','npu=2','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_A900 }}
      PreSmoke_harmony-infer-chs-transformer:
        name: PreSmoke_harmony-infer-chs-transformer
        uses: .gitcode/workflows/kirin_pre_smoke_action.yml
        with:
          repo_name: 'ops-transformer'
          device_type: 'chs_phone'
          rdv_script: 'rdv_kirin9030_gitcode.sh'
          chip_version: 'Kirin9030'
          cases_pool: 'transformer_all.json'
          cases_baseline: 'transformer.json'
      PreSmoke_harmony-infer-cpro-transformer:
        name: PreSmoke_harmony-infer-cpro-transformer
        uses: .gitcode/workflows/kirin_pre_smoke_action.yml
        with:
          repo_name: 'ops-transformer'
          device_type: 'kirinx90'
          rdv_script: 'rdv_kirinx90_gitcode.sh'
          chip_version: 'KirinX90'
          cases_pool: 'transformer_all.json'
          cases_baseline: 'transformer.json'
    pre:
    - type: auto
    fail-fast: false
  stage4:
    name: ut_report
    jobs:
      JOB_ut_report:
        name: UT_report
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ut_report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "ops-transformer"
              modules: "ops-transformer"
