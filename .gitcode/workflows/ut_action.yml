name: ut_action

on:
  workflow_call:
    inputs:
      image_version:
        required: true
        type: string
      ge_st_rt2:
        required: false
        type: string
        default: ''

jobs:
  JOB_ut:
    permissions:
      repository: read
      id-token: write
    name: UT
    needs: []
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/ut.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: redis-cache
        uses: cann/.gitcode/actions/redis-cache@master
      -
        name: ut_acc
        identifier: ut
        timeout-minutes: 90
        run: |
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          cd ${{ steps.process_checkout.outputs.path }}
          export GE_ST_RT2=${{ inputs.ge_st_rt2 }}
          export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
          bash ut.sh
      -
        name: ut_cov
        identifier: ut_cov
        uses: cann/.gitcode/actions/ut-cov-report@master
        with:
          ut_process: ${{ steps.ut.outputs.ut_process }}
          workspace: ${{ steps.process_checkout.outputs.path }}
          ut_type: ops-transformer
          target_branch: ${{ env.TARGET_BRANCH }}
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/coverage_*.info
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on: ["self-hosted", "arch=x64", "spec=xlarge"]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
